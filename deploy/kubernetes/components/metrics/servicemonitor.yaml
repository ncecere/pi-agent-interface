apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pi-agent-interface
  labels:
    app.kubernetes.io/name: pi-agent-interface
    app.kubernetes.io/part-of: pi-agent-interface
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent-interface
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
