# Port "http" (80) is what the Ingress or HTTPRoute targets. Conversations
# stream over server-sent events through the app, which any replica serves, so
# no session affinity is needed.
apiVersion: v1
kind: Service
metadata:
  name: pi-agent-interface
  labels:
    app.kubernetes.io/name: pi-agent-interface
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: pi-agent-interface
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: pi-agent-interface
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
