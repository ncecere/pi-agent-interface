# Pi Agent Interface: a generic Kubernetes base (see ../README.md).
#
# Namespace-agnostic and free of secret values. An overlay sets the namespace,
# pins the image by digest, merges its settings into pi-agent-interface-config,
# creates the secret pi-agent-interface-runtime and adds an Ingress or Gateway
# API route.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicies.yaml

# pi-agent-interface-config, from config.env. The name gets a hash of the
# content, and the Deployment's references follow, so a configuration change
# rolls the pods. Overlays merge keys:
#   configMapGenerator:
#     - name: pi-agent-interface-config
#       behavior: merge
#       literals:
#         - APP_URL=https://chat.example.org
configMapGenerator:
  - name: pi-agent-interface-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: pi-agent-interface
        app.kubernetes.io/part-of: pi-agent-interface

# The release this base shipped with. A tag can move, so overlays should pin
# the digest shown on the GitHub Release (verify its cosign signature first;
# the digest takes precedence over the tag), never `latest`:
#   images:
#     - name: ghcr.io/ncecere/pi-agent-interface
#       newTag: v0.5.0
#       digest: sha256:<digest>
images:
  - name: ghcr.io/ncecere/pi-agent-interface
    newTag: v0.5.0
